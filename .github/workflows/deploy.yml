name: Deploy Theme

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ssh.phx.nearlyfreespeech.net
          username: ${{ secrets.NFSN_USER }}
          password: ${{ secrets.NFSN_PASSWORD }}
          local_path: './*'
          remote_path: '/home/public/wp-content/themes/hypatia/'
          sftpArgs: '-o StrictHostKeyChecking=no'
